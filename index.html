<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo_o.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KedoAI</title>

    <!-- 预加载字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
      html, body, #app {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      
      /* Loading animation styles */
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #F7FAFD;
        transition: opacity 0.5s, visibility 0.5s;
      }
      
      /* Logo container with glow effect */
      .logo-container {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      /* Glowing effect behind the logo */
      .logo-glow {
        position: absolute;
        width: 100px;
        height: 100px;
        background: rgba(47, 192, 255, 0.15);
        border-radius: 50%;
        filter: blur(15px);
        z-index: -1;
        animation: pulse 2s infinite alternate;
      }
      
      /* Decorative background elements */
      .app-loading::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, rgba(47, 192, 255, 0.05) 0%, rgba(47, 192, 255, 0) 70%);
        z-index: -2;
      }
      
      .app-loading.loaded {
        opacity: 0;
        visibility: hidden;
      }
      
      .app-loading-logo {
        width: 80px;
        height: 80px;
        animation: logo-spin 1.5s infinite linear;
      }
      
      .app-loading-text {
        margin-top: 20px;
        font-size: 16px;
        color: #3D556A;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.5px;
        animation: pulse 1.5s infinite;
      }
      
      @keyframes logo-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      
      @keyframes pulse {
        0% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0.6;
        }
      }
      
      @keyframes glow-pulse {
        0% {
          transform: scale(0.9);
          opacity: 0.7;
        }
        100% {
          transform: scale(1.1);
          opacity: 0.9;
        }
      }
    </style>
  </head>
  <body>
    <!-- Loading animation -->
    <div class="app-loading">
      <div class="logo-container">
        <img src="/logo_o.svg" alt="Loading" class="app-loading-logo">
        <div class="logo-glow"></div>
      </div>
    </div>
    
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
