<?xml version="1.0" encoding="UTF-8"?>
<svg width="280" height="200" viewBox="0 0 280 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E9CFF"/>
      <stop offset="50%" style="stop-color:#0DA8EF"/>
      <stop offset="100%" style="stop-color:#70D3FF"/>
    </linearGradient>
    
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0F5FF"/>
      <stop offset="100%" style="stop-color:#70D3FF"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#70D3FF"/>
      <stop offset="100%" style="stop-color:#B8E6FF"/>
    </linearGradient>

    <!-- 滤镜效果 -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 飘浮装饰元素 -->
  <g opacity="0.4">
    <circle cx="40" cy="40" r="4" fill="url(#accentGradient)">
      <animate attributeName="cy" values="35;45;35" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="160" r="3" fill="url(#lightGradient)">
      <animate attributeName="cy" values="155;165;155" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="50" r="3.5" fill="url(#primaryGradient)">
      <animate attributeName="cy" values="45;55;45" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 主要工作界面 -->
  <g transform="translate(140, 100)">
    <!-- 主屏幕框架 -->
    <rect x="-60" y="-40" width="120" height="80" rx="16" fill="none" stroke="url(#primaryGradient)" stroke-width="3" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite"/>
    </rect>
    
    <!-- 屏幕内容区域 -->
    <rect x="-54" y="-34" width="108" height="68" rx="12" fill="none" stroke="url(#lightGradient)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- 顶部工具栏 -->
    <g transform="translate(-48, -28)">
      <rect x="0" y="0" width="96" height="8" rx="4" fill="url(#accentGradient)" opacity="0.3"/>
      <circle cx="6" cy="4" r="2" fill="url(#primaryGradient)" opacity="0.8"/>
      <circle cx="14" cy="4" r="2" fill="url(#lightGradient)" opacity="0.8"/>
      <circle cx="22" cy="4" r="2" fill="url(#accentGradient)" opacity="0.8"/>
    </g>
    
    <!-- 左侧边栏 -->
    <rect x="-48" y="-18" width="20" height="50" rx="4" fill="none" stroke="url(#lightGradient)" stroke-width="1.5" opacity="0.4"/>
    
    <!-- 主内容区域 -->
    <g transform="translate(-24, -15)">
      <!-- 内容块 -->
      <rect x="0" y="0" width="60" height="44" rx="6" fill="none" stroke="url(#accentGradient)" stroke-width="1" opacity="0.5"/>
      
      <!-- 动态内容条 -->
      <g transform="translate(6, 8)">
        <rect x="0" y="0" width="30" height="3" rx="1.5" fill="url(#primaryGradient)" opacity="0.7">
          <animate attributeName="width" values="25;35;25" dur="3s" repeatCount="indefinite"/>
        </rect>
        <rect x="0" y="8" width="25" height="3" rx="1.5" fill="url(#lightGradient)" opacity="0.6">
          <animate attributeName="width" values="20;30;20" dur="3.5s" repeatCount="indefinite"/>
        </rect>
        <rect x="0" y="16" width="35" height="3" rx="1.5" fill="url(#accentGradient)" opacity="0.5">
          <animate attributeName="width" values="30;40;30" dur="4s" repeatCount="indefinite"/>
        </rect>
        
        <!-- 图表元素 -->
        <g transform="translate(0, 26)">
          <circle cx="8" cy="4" r="2.5" fill="url(#primaryGradient)" opacity="0.8">
            <animate attributeName="r" values="2;3.5;2" dur="2.5s" repeatCount="indefinite"/>
          </circle>
          <circle cx="20" cy="2" r="2" fill="url(#lightGradient)" opacity="0.7">
            <animate attributeName="r" values="1.5;3;1.5" dur="3s" repeatCount="indefinite"/>
          </circle>
          <circle cx="32" cy="6" r="2.2" fill="url(#accentGradient)" opacity="0.6">
            <animate attributeName="r" values="1.8;3.2;1.8" dur="3.5s" repeatCount="indefinite"/>
          </circle>
          <!-- 连接线 -->
          <path d="M10,4 Q15,1 18,2 Q25,4 30,6" stroke="url(#primaryGradient)" stroke-width="1.5" fill="none" opacity="0.6">
            <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
          </path>
        </g>
      </g>
    </g>
  </g>

  <!-- 左侧AI大脑图标 -->
  <g transform="translate(60, 70)">
    <!-- 外围光环 -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="url(#accentGradient)" stroke-width="2" opacity="0.3">
      <animate attributeName="r" values="22;28;22" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 大脑主体 -->
    <path d="M-12,-8 Q-16,-12 -8,-12 Q-2,-14 4,-12 Q12,-12 8,-8 Q12,-2 8,8 Q4,12 -2,12 Q-8,12 -12,8 Q-16,-2 -12,-8 Z" 
          fill="none" stroke="url(#primaryGradient)" stroke-width="2.5" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- 大脑分割线 -->
    <path d="M0,-12 Q-1,-6 0,-2 Q1,4 0,8 Q-1,12 0,12" stroke="url(#lightGradient)" stroke-width="1.5" 
          opacity="0.7" fill="none">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
    </path>
    
    <!-- 神经网络节点 -->
    <circle cx="-6" cy="-4" r="1.5" fill="url(#primaryGradient)">
      <animate attributeName="r" values="1;2.5;1" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="6" cy="-2" r="1.5" fill="url(#lightGradient)">
      <animate attributeName="r" values="1;2.5;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-3" cy="4" r="1.2" fill="url(#accentGradient)">
      <animate attributeName="r" values="0.8;2;0.8" dur="2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="4" cy="6" r="1.2" fill="url(#primaryGradient)">
      <animate attributeName="r" values="0.8;2;0.8" dur="2s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 思维火花 -->
    <g transform="translate(15, -15)" opacity="0.6">
      <circle cx="0" cy="0" r="2" fill="url(#accentGradient)">
        <animate attributeName="r" values="1;3;1" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 右侧工具生态 -->
  <g transform="translate(220, 70)">
    <!-- 工具集合圆环 -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="url(#lightGradient)" stroke-width="2" opacity="0.4">
      <animate attributeName="r" values="18;22;18" dur="5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 中央齿轮 -->
    <g transform="rotate(0)">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="12s" repeatCount="indefinite"/>
      <path d="M-8,-2 L-4,-6 L4,-6 L8,-2 L8,2 L4,6 L-4,6 L-8,2 Z" 
            fill="none" stroke="url(#primaryGradient)" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="url(#primaryGradient)" stroke-width="2"/>
    </g>
    
    <!-- 环绕工具图标 -->
    <g transform="rotate(0)">
      <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="20s" repeatCount="indefinite"/>
      
      <!-- 工具1 -->
      <g transform="translate(0, -15)">
        <circle cx="0" cy="0" r="3" fill="none" stroke="url(#accentGradient)" stroke-width="1.5"/>
        <rect x="-1.5" y="-1.5" width="3" height="3" rx="0.5" fill="url(#accentGradient)" opacity="0.7"/>
      </g>
      
      <!-- 工具2 -->
      <g transform="translate(12, -9)">
        <polygon points="0,-2 2,0 0,2 -2,0" fill="none" stroke="url(#lightGradient)" stroke-width="1.5"/>
      </g>
      
      <!-- 工具3 -->
      <g transform="translate(12, 9)">
        <circle cx="0" cy="0" r="2" fill="none" stroke="url(#primaryGradient)" stroke-width="1.5"/>
      </g>
      
      <!-- 工具4 -->
      <g transform="translate(-12, 9)">
        <rect x="-1.5" y="-1.5" width="3" height="3" rx="0.5" fill="none" stroke="url(#lightGradient)" stroke-width="1.5"/>
      </g>
    </g>
    
    <!-- 连接线 -->
    <g opacity="0.4">
      <path d="M12,0 Q15,0 15,8" stroke="url(#accentGradient)" stroke-width="1.5" fill="none">
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 底部数据流动 -->
  <g transform="translate(0, 170)" opacity="0.3">
    <path d="M30,15 Q90,8 140,15 Q190,22 250,15" 
          stroke="url(#primaryGradient)" stroke-width="2" fill="none">
      <animate attributeName="d" 
               values="M30,15 Q90,8 140,15 Q190,22 250,15;
                       M30,12 Q90,18 140,12 Q190,8 250,18;
                       M30,15 Q90,8 140,15 Q190,22 250,15" 
               dur="8s" repeatCount="indefinite"/>
    </path>
    
    <!-- 流动数据点 -->
    <circle cx="50" cy="13" r="2" fill="url(#accentGradient)">
      <animate attributeName="cx" values="30;250;30" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="17" r="1.5" fill="url(#lightGradient)">
      <animate attributeName="cx" values="250;30;250" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg> 