<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E9CFF"/>
      <stop offset="100%" style="stop-color:#0DA8EF"/>
    </linearGradient>
    
    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#70D3FF"/>
      <stop offset="100%" style="stop-color:#1E9CFF"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0F5FF"/>
      <stop offset="100%" style="stop-color:#70D3FF"/>
    </linearGradient>

    <!-- 滤镜效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="90" fill="url(#mainGradient)" opacity="0.1">
    <animate attributeName="r" values="85;95;85" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- 主要对话气泡 -->
  <g transform="translate(50, 40)">
    <!-- 用户对话气泡 -->
    <rect x="0" y="0" width="80" height="35" rx="18" fill="url(#mainGradient)" filter="url(#glow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </rect>
    <circle cx="15" cy="17" r="3" fill="white" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" cy="17" r="3" fill="white" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="17" r="3" fill="white" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- AI回复气泡 -->
  <g transform="translate(70, 90)">
    <rect x="0" y="0" width="100" height="35" rx="18" fill="url(#secondaryGradient)" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <!-- AI思考指示器 -->
    <g transform="translate(10, 10)">
      <rect x="0" y="0" width="80" height="3" rx="1.5" fill="white" opacity="0.7">
        <animate attributeName="width" values="0;80;80;0" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="8" width="60" height="3" rx="1.5" fill="white" opacity="0.5">
        <animate attributeName="width" values="0;60;60;0" dur="4s" begin="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="16" width="40" height="3" rx="1.5" fill="white" opacity="0.3">
        <animate attributeName="width" values="0;40;40;0" dur="4s" begin="2.5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- 数据分析图表 -->
  <g transform="translate(30, 140)">
    <!-- 图表背景 -->
    <rect x="0" y="0" width="70" height="45" rx="8" fill="white" stroke="url(#accentGradient)" stroke-width="2" opacity="0.9"/>
    
    <!-- 动态数据柱 -->
    <rect x="8" y="25" width="8" height="15" fill="url(#mainGradient)">
      <animate attributeName="height" values="5;20;10;15" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="35;20;30;25" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="20" width="8" height="20" fill="url(#secondaryGradient)">
      <animate attributeName="height" values="10;25;15;20" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="30;15;25;20" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="32" y="15" width="8" height="25" fill="url(#accentGradient)">
      <animate attributeName="height" values="15;30;20;25" dur="4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="25;10;20;15" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="44" y="22" width="8" height="18" fill="url(#mainGradient)">
      <animate attributeName="height" values="8;23;13;18" dur="3.2s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="32;17;27;22" dur="3.2s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="56" y="18" width="8" height="22" fill="url(#secondaryGradient)">
      <animate attributeName="height" values="12;27;17;22" dur="3.8s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="28;13;23;18" dur="3.8s" begin="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 数据流动效果 -->
  <g transform="translate(110, 140)">
    <!-- 数据流节点 -->
    <circle cx="15" cy="15" r="6" fill="url(#mainGradient)">
      <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="15" r="6" fill="url(#secondaryGradient)">
      <animate attributeName="r" values="4;8;4" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="15" r="6" fill="url(#accentGradient)">
      <animate attributeName="r" values="4;8;4" dur="2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 连接线动画 -->
    <line x1="21" y1="15" x2="29" y2="15" stroke="url(#mainGradient)" stroke-width="3" opacity="0.7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="41" y1="15" x2="49" y2="15" stroke="url(#secondaryGradient)" stroke-width="3" opacity="0.7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 智能分析指示器 -->
  <g transform="translate(140, 60)">
    <!-- 脑波效果 -->
    <path d="M0,20 Q10,10 20,20 T40,20" stroke="url(#mainGradient)" stroke-width="2" fill="none" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M0,25 Q15,15 30,25 T60,25" stroke="url(#secondaryGradient)" stroke-width="2" fill="none" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    
    <!-- 分析节点 -->
    <circle cx="20" cy="20" r="4" fill="url(#accentGradient)">
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 环绕光环效果 -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#accentGradient)" stroke-width="1" opacity="0.4">
    <animate attributeName="stroke-dasharray" values="0,471;117,354;235,236;471,0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="6s" repeatCount="indefinite"/>
  </circle>


</svg> 