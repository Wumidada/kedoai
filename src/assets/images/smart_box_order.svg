<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形 -->
  <circle cx="200" cy="200" r="180" fill="#F0F9FF"/>
  <circle cx="200" cy="200" r="150" fill="#E6F7FF" opacity="0.8">
    <animate attributeName="r" values="145;155;145" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- 礼盒主体 -->
  <g transform="translate(200, 200)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.1))">
    <!-- 礼盒前面 -->
    <path d="M-100,50 L-50,-50 L50,-50 L100,50 Z" fill="#60A5FA" opacity="0.8">
      <animateTransform attributeName="transform" type="scale" values="0.98;1.02;0.98" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- 礼盒右侧面 -->
    <path d="M100,50 L150,0 L150,100 L100,50 Z" fill="#3B82F6" opacity="0.9">
      <animateTransform attributeName="transform" type="scale" values="0.98;1.02;0.98" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- 礼盒左侧面 -->
    <path d="M-100,50 L-150,0 L-150,100 L-100,50 Z" fill="#93C5FD" opacity="0.7">
      <animateTransform attributeName="transform" type="scale" values="0.98;1.02;0.98" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- 礼盒顶面 -->
    <path d="M-50,-50 L50,-50 L150,0 L-150,0 Z" fill="#3B82F6" opacity="0.8">
      <animateTransform attributeName="transform" type="scale" values="0.98;1.02;0.98" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- 礼盒底面 -->
    <path d="M-100,50 L100,50 L150,100 L-150,100 Z" fill="#2563EB" opacity="0.9">
      <animateTransform attributeName="transform" type="scale" values="0.98;1.02;0.98" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- 垂直丝带 -->
    <path d="M-15,-50 L-15,100 L15,100 L15,-50 Z" fill="#93C5FD" opacity="0.9">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- 水平丝带 -->
    <path d="M-150,15 L150,15 L150,-15 L-150,-15 Z" fill="#93C5FD" opacity="0.9">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" begin="1s" repeatCount="indefinite"/>
    </path>
    
    <!-- 蝴蝶结 -->
    <g fill="#BFDBFE">
      <!-- 左侧蝴蝶结 -->
      <path d="M-40,-15 C-60,5 -60,35 -40,55" stroke="#BFDBFE" stroke-width="20" stroke-linecap="round" fill="none">
        <animate attributeName="d" values="M-40,-15 C-60,5 -60,35 -40,55;M-40,-20 C-65,0 -65,30 -40,50;M-40,-15 C-60,5 -60,35 -40,55" dur="4s" repeatCount="indefinite"/>
      </path>
      <!-- 右侧蝴蝶结 -->
      <path d="M40,-15 C60,5 60,35 40,55" stroke="#BFDBFE" stroke-width="20" stroke-linecap="round" fill="none">
        <animate attributeName="d" values="M40,-15 C60,5 60,35 40,55;M40,-20 C65,0 65,30 40,50;M40,-15 C60,5 60,35 40,55" dur="4s" repeatCount="indefinite"/>
      </path>
      <!-- 蝴蝶结中心 -->
      <rect x="-25" y="10" width="50" height="20" rx="4" fill="#BFDBFE">
        <animate attributeName="rx" values="4;8;4" dur="3s" repeatCount="indefinite"/>
      </rect>
      <!-- 蝴蝶结结 -->
      <path d="M-25,10 Q0,-20 25,10" stroke="#BFDBFE" stroke-width="15" stroke-linecap="round" fill="none">
        <animate attributeName="d" values="M-25,10 Q0,-20 25,10;M-25,10 Q0,-25 25,10;M-25,10 Q0,-20 25,10" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- 电路纹理和图标 -->
    <g stroke="white" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- 前面电路 -->
      <g transform="translate(0, 25)">
        <!-- 左侧电路 -->
        <line x1="-70" y1="-40" x2="-70" y2="40">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
        </line>
        <line x1="-70" y1="-40" x2="-40" y2="-40">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.2s" repeatCount="indefinite"/>
        </line>
        <line x1="-70" y1="0" x2="-40" y2="0">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.4s" repeatCount="indefinite"/>
        </line>
        <line x1="-70" y1="40" x2="-40" y2="40">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.6s" repeatCount="indefinite"/>
        </line>
        <circle cx="-70" cy="-40" r="3" fill="white">
          <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-70" cy="0" r="3" fill="white">
          <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" begin="0.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-70" cy="40" r="3" fill="white">
          <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" begin="0.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-40" cy="-40" r="3" fill="white">
          <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" begin="0.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-40" cy="0" r="3" fill="white">
          <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" begin="0.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-40" cy="40" r="3" fill="white">
          <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" begin="1s" repeatCount="indefinite"/>
        </circle>
        
        <!-- 右侧电路 -->
        <line x1="70" y1="-40" x2="70" y2="40">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.8s" repeatCount="indefinite"/>
        </line>
        <line x1="70" y1="-40" x2="40" y2="-40">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1s" repeatCount="indefinite"/>
        </line>
        <line x1="70" y1="0" x2="40" y2="0">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1.2s" repeatCount="indefinite"/>
        </line>
        <line x1="70" y1="40" x2="40" y2="40">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1.4s" repeatCount="indefinite"/>
        </line>
        <circle cx="70" cy="-40" r="3" fill="white">
          <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" begin="0.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="70" cy="0" r="3" fill="white">
          <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" begin="1.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="70" cy="40" r="3" fill="white">
          <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" begin="1.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="40" cy="-40" r="3" fill="white">
          <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" begin="1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="40" cy="0" r="3" fill="white">
          <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" begin="1.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="40" cy="40" r="3" fill="white">
          <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" begin="1.8s" repeatCount="indefinite"/>
        </circle>
        
        <!-- 中间图标 -->
        <g transform="translate(0, 0)">
          <circle cx="0" cy="0" r="15" fill="white" opacity="0.2">
            <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
          </circle>
          <circle cx="0" cy="0" r="10" fill="white" opacity="0.4">
            <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" begin="0.5s" repeatCount="indefinite"/>
          </circle>
          <path d="M-8,-8 L8,8 M8,-8 L-8,8" stroke="white" stroke-width="2" stroke-linecap="round">
            <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
          </path>
        </g>
      </g>
      
      <!-- 右侧面电路 -->
      <g transform="translate(125, 25)">
        <line x1="-20" y1="-50" x2="-20" y2="50">
          <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" begin="0.1s" repeatCount="indefinite"/>
        </line>
        <line x1="-20" y1="-50" x2="20" y2="-50">
          <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" begin="0.3s" repeatCount="indefinite"/>
        </line>
        <line x1="-20" y1="0" x2="20" y2="0">
          <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" begin="0.5s" repeatCount="indefinite"/>
        </line>
        <line x1="-20" y1="50" x2="20" y2="50">
          <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" begin="0.7s" repeatCount="indefinite"/>
        </line>
        <circle cx="-20" cy="-50" r="2.5" fill="white">
          <animate attributeName="r" values="2;3;2" dur="2s" begin="0.1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-20" cy="0" r="2.5" fill="white">
          <animate attributeName="r" values="2;3;2" dur="2s" begin="0.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-20" cy="50" r="2.5" fill="white">
          <animate attributeName="r" values="2;3;2" dur="2s" begin="0.9s" repeatCount="indefinite"/>
        </circle>
        <circle cx="20" cy="-50" r="2.5" fill="white">
          <animate attributeName="r" values="2;3;2" dur="2s" begin="0.3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="20" cy="0" r="2.5" fill="white">
          <animate attributeName="r" values="2;3;2" dur="2s" begin="0.7s" repeatCount="indefinite"/>
        </circle>
        <circle cx="20" cy="50" r="2.5" fill="white">
          <animate attributeName="r" values="2;3;2" dur="2s" begin="1.1s" repeatCount="indefinite"/>
        </circle>
        
        <!-- 右侧面图标 -->
        <g transform="translate(0, -30)">
          <circle cx="0" cy="0" r="8" fill="white" opacity="0.3">
            <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
          </circle>
          <circle cx="0" cy="0" r="4" fill="white" opacity="0.6">
            <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" begin="0.5s" repeatCount="indefinite"/>
          </circle>
        </g>
      </g>
      
      <!-- 左侧面电路 -->
      <g transform="translate(-125, 25)">
        <line x1="-20" y1="-50" x2="-20" y2="50">
          <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" begin="0.9s" repeatCount="indefinite"/>
        </line>
        <line x1="-20" y1="-50" x2="20" y2="-50">
          <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" begin="1.1s" repeatCount="indefinite"/>
        </line>
        <line x1="-20" y1="0" x2="20" y2="0">
          <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" begin="1.3s" repeatCount="indefinite"/>
        </line>
        <line x1="-20" y1="50" x2="20" y2="50">
          <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" begin="1.5s" repeatCount="indefinite"/>
        </line>
        <circle cx="-20" cy="-50" r="2.5" fill="white">
          <animate attributeName="r" values="2;3;2" dur="2s" begin="0.9s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-20" cy="0" r="2.5" fill="white">
          <animate attributeName="r" values="2;3;2" dur="2s" begin="1.3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-20" cy="50" r="2.5" fill="white">
          <animate attributeName="r" values="2;3;2" dur="2s" begin="1.7s" repeatCount="indefinite"/>
        </circle>
        <circle cx="20" cy="-50" r="2.5" fill="white">
          <animate attributeName="r" values="2;3;2" dur="2s" begin="1.1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="20" cy="0" r="2.5" fill="white">
          <animate attributeName="r" values="2;3;2" dur="2s" begin="1.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="20" cy="50" r="2.5" fill="white">
          <animate attributeName="r" values="2;3;2" dur="2s" begin="1.9s" repeatCount="indefinite"/>
        </circle>
      </g>
      
      <!-- 顶面电路 -->
      <g transform="translate(0, -25)">
        <line x1="-75" y1="-25" x2="75" y2="-25">
          <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" begin="1.7s" repeatCount="indefinite"/>
        </line>
        <line x1="-75" y1="25" x2="75" y2="25">
          <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" begin="1.9s" repeatCount="indefinite"/>
        </line>
        <line x1="0" y1="-25" x2="0" y2="25">
          <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" begin="2.1s" repeatCount="indefinite"/>
        </line>
        <circle cx="-75" cy="-25" r="2.5" fill="white">
          <animate attributeName="r" values="2;3;2" dur="2s" begin="1.7s" repeatCount="indefinite"/>
        </circle>
        <circle cx="75" cy="-25" r="2.5" fill="white">
          <animate attributeName="r" values="2;3;2" dur="2s" begin="1.9s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-75" cy="25" r="2.5" fill="white">
          <animate attributeName="r" values="2;3;2" dur="2s" begin="2.1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="75" cy="25" r="2.5" fill="white">
          <animate attributeName="r" values="2;3;2" dur="2s" begin="2.3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="-25" r="2.5" fill="white">
          <animate attributeName="r" values="2;3;2" dur="2s" begin="2.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="25" r="2.5" fill="white">
          <animate attributeName="r" values="2;3;2" dur="2s" begin="2.7s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- 装饰点 -->
  <circle cx="200" cy="120" r="3" fill="#93C5FD" opacity="0.6">
    <animate attributeName="r" values="2;4;2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="200" r="3" fill="#93C5FD" opacity="0.6">
    <animate attributeName="r" values="2;4;2" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="280" r="3" fill="#93C5FD" opacity="0.6">
    <animate attributeName="r" values="2;4;2" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="200" r="3" fill="#93C5FD" opacity="0.6">
    <animate attributeName="r" values="2;4;2" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="80" r="2" fill="#93C5FD" opacity="0.4">
    <animate attributeName="r" values="1.5;2.5;1.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- 光点流动效果 -->
  <g>
    <!-- 前面电路光点 -->
    <circle cx="-70" cy="-15" r="4" fill="white" opacity="0.8" transform="translate(200, 200)">
      <animate attributeName="cy" values="-15;65;-15" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="-15" r="4" fill="white" opacity="0.8" transform="translate(200, 200)">
      <animate attributeName="cy" values="-15;65;-15" dur="4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 右侧面电路光点 -->
    <circle cx="125" cy="-25" r="4" fill="white" opacity="0.8" transform="translate(200, 200)">
      <animate attributeName="cy" values="-25;75;-25" dur="4s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 左侧面电路光点 -->
    <circle cx="-125" cy="-25" r="4" fill="white" opacity="0.8" transform="translate(200, 200)">
      <animate attributeName="cy" values="-25;75;-25" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 顶面电路光点 -->
    <circle cx="0" cy="-25" r="4" fill="white" opacity="0.8" transform="translate(200, 200)">
      <animate attributeName="cx" values="-75;75;-75" dur="4s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>