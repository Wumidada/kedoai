<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="coreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E9CFF"/>
      <stop offset="50%" style="stop-color:#0DA8EF"/>
      <stop offset="100%" style="stop-color:#0B8ED8"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#70D3FF"/>
      <stop offset="100%" style="stop-color:#1E9CFF"/>
    </linearGradient>
    
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0F5FF"/>
      <stop offset="100%" style="stop-color:#70D3FF"/>
    </linearGradient>

    <!-- 滤镜效果 -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 背景网格效果 -->
  <g opacity="0.1">
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="url(#coreGradient)" stroke-width="0.5"/>
    </pattern>
    <rect width="200" height="200" fill="url(#grid)"/>
  </g>

  <!-- 中央订单处理核心 -->
  <g transform="translate(100, 100)">
    <!-- 核心光环 -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#coreGradient)" stroke-width="2">
      <animate attributeName="r" values="38;42;38" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 订单处理中心 -->
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="white" opacity="0.95">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
    </rect>
    
    <!-- 订单图标 -->
    <g>
      <!-- 订单表单 -->
      <rect x="-15" y="-12" width="30" height="20" rx="3" fill="url(#accentGradient)"/>
      <!-- 订单详情 -->
      <line x1="-10" y1="-6" x2="10" y2="-6" stroke="white" stroke-width="1"/>
      <line x1="-10" y1="-2" x2="10" y2="-2" stroke="white" stroke-width="1"/>
      <line x1="-10" y1="2" x2="8" y2="2" stroke="white" stroke-width="1"/>
      <!-- 订单状态标记 -->
      <circle cx="12" cy="2" r="2" fill="white"/>
    </g>
    
    <!-- 动态数据流 -->
    <g>
      <circle cx="0" cy="0" r="2" fill="url(#lightGradient)">
        <animate attributeName="r" values="1;3;1" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="15" r="1.5" fill="url(#lightGradient)">
        <animate attributeName="r" values="1;2.5;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-15" cy="-15" r="1.5" fill="url(#lightGradient)">
        <animate attributeName="r" values="1;2.5;1" dur="2s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 订单流程模块 -->
  <!-- 产品选择 -->
  <g transform="translate(160, 60)">
    <circle cx="0" cy="0" r="25" fill="url(#accentGradient)" filter="url(#softGlow)">
      <animate attributeName="r" values="23;27;23" dur="3s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(0, 0)">
      <!-- 产品图标 -->
      <rect x="-8" y="-5" width="16" height="10" rx="2" fill="white"/>
      <rect x="-6" y="-3" width="4" height="6" rx="1" fill="#1E9CFF"/>
      <rect x="2" y="-3" width="4" height="6" rx="1" fill="#1E9CFF"/>
    </g>
  </g>

  <!-- 支付处理 -->
  <g transform="translate(160, 140)">
    <circle cx="0" cy="0" r="25" fill="url(#accentGradient)" filter="url(#softGlow)">
      <animate attributeName="r" values="23;27;23" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(0, 0)">
      <!-- 支付图标 -->
      <rect x="-8" y="-5" width="16" height="10" rx="2" fill="white"/>
      <line x1="-6" y1="-2" x2="6" y2="-2" stroke="#1E9CFF" stroke-width="1.5"/>
      <line x1="-6" y1="2" x2="4" y2="2" stroke="#1E9CFF" stroke-width="1.5"/>
      <circle cx="6" cy="0" r="2" fill="#1E9CFF"/>
    </g>
  </g>

  <!-- 物流配送 -->
  <g transform="translate(40, 140)">
    <circle cx="0" cy="0" r="25" fill="url(#accentGradient)" filter="url(#softGlow)">
      <animate attributeName="r" values="23;27;23" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(0, 0)">
      <!-- 物流图标 -->
      <circle cx="0" cy="0" r="6" fill="white"/>
      <rect x="-10" y="0" width="20" height="3" rx="1.5" fill="white"/>
      <line x1="0" y1="-6" x2="0" y2="-2" stroke="#1E9CFF" stroke-width="1.5"/>
      <line x1="-3" y1="-4" x2="3" y2="-4" stroke="#1E9CFF" stroke-width="1.5"/>
    </g>
  </g>

  <!-- 客户服务 -->
  <g transform="translate(40, 60)">
    <circle cx="0" cy="0" r="25" fill="url(#accentGradient)" filter="url(#softGlow)">
      <animate attributeName="r" values="23;27;23" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(0, 0)">
      <!-- 客服图标 -->
      <circle cx="0" cy="0" r="6" fill="white"/>
      <path d="M-3,-2 Q-3,-4 0,-4 Q3,-4 3,-2 Q3,1 0,3 Q-3,1 -3,-2" fill="#1E9CFF"/>
      <line x1="-3" y1="4" x2="3" y2="4" stroke="#1E9CFF" stroke-width="1.5"/>
    </g>
  </g>

  <!-- 流程连接线 -->
  <g opacity="0.6">
    <line x1="130" y1="80" x2="130" y2="120" stroke="url(#coreGradient)" stroke-width="2">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="70" y1="80" x2="70" y2="120" stroke="url(#coreGradient)" stroke-width="2">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="80" y1="130" x2="120" y2="130" stroke="url(#coreGradient)" stroke-width="2">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" begin="1s" repeatCount="indefinite"/>
    </line>
    <line x1="80" y1="70" x2="120" y2="70" stroke="url(#coreGradient)" stroke-width="2">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 动态数据流动效果 -->
  <g>
    <!-- 顺时针流动 -->
    <circle cx="0" cy="0" r="3" fill="url(#lightGradient)" opacity="0.8">
      <animateMotion dur="8s" repeatCount="indefinite" path="M100,60 Q160,100 100,140 Q40,100 100,60"/>
      <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <!-- 逆时针流动 -->
    <circle cx="0" cy="0" r="2" fill="url(#accentGradient)" opacity="0.6">
      <animateMotion dur="6s" begin="2s" repeatCount="indefinite" path="M100,60 Q40,100 100,140 Q160,100 100,60"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 脉冲效果 -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#coreGradient)" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="50;80;50" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#accentGradient)" stroke-width="1" opacity="0.2">
      <animate attributeName="r" values="60;90;60" dur="4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="4s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 装饰元素 -->
  <g opacity="0.3">
    <circle cx="20" cy="20" r="5" fill="url(#lightGradient)">
      <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="20" r="5" fill="url(#lightGradient)">
      <animate attributeName="r" values="3;6;3" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="180" r="5" fill="url(#lightGradient)">
      <animate attributeName="r" values="3;6;3" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="180" r="5" fill="url(#lightGradient)">
      <animate attributeName="r" values="3;6;3" dur="3s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>