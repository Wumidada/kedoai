<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="coreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E9CFF"/>
      <stop offset="50%" style="stop-color:#0DA8EF"/>
      <stop offset="100%" style="stop-color:#0B8ED8"/>
    </linearGradient>
    
    <linearGradient id="toolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#70D3FF"/>
      <stop offset="100%" style="stop-color:#1E9CFF"/>
    </linearGradient>
    
    <linearGradient id="chainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0F5FF"/>
      <stop offset="100%" style="stop-color:#70D3FF"/>
    </linearGradient>

    <!-- 滤镜效果 -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="toolGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景能量场 -->
  <circle cx="100" cy="100" r="95" fill="url(#coreGradient)" opacity="0.06">
    <animate attributeName="r" values="90;105;90" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- 中央AI调度中心 -->
  <g transform="translate(100, 100)">
    <!-- 主控制核心 -->
    <circle cx="0" cy="0" r="30" fill="url(#coreGradient)" filter="url(#coreGlow)">
      <animate attributeName="r" values="28;32;28" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 内核控制台 -->
    <circle cx="0" cy="0" r="22" fill="white" opacity="0.95"/>
    
    <!-- 人类大脑核心 -->
    <g transform="translate(0, 0)">
      <!-- 左半球 -->
      <path d="M-8,-4 Q-10,-7 -6,-7 Q-3,-8 0,-7 Q0,-5 0,0 Q0,5 -2,7 Q-5,5 -6,2 Q-8,0 -8,-4 Z" 
            fill="url(#coreGradient)" opacity="0.9">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      </path>
      
      <!-- 右半球 -->
      <path d="M8,-4 Q10,-7 6,-7 Q3,-8 0,-7 Q0,-5 0,0 Q0,5 2,7 Q5,5 6,2 Q8,0 8,-4 Z" 
            fill="url(#coreGradient)" opacity="0.85">
        <animate attributeName="opacity" values="0.6;0.95;0.6" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      </path>
      
      <!-- 大脑皮层褶皱 -->
      <g stroke="white" stroke-width="0.6" opacity="0.7" fill="none">
        <path d="M-6,-5 Q-4,-6 -2,-5 Q-1,-4 0,-5">
          <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
        </path>
        <path d="M6,-5 Q4,-6 2,-5 Q1,-4 0,-5">
          <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" begin="0.5s" repeatCount="indefinite"/>
        </path>
        <path d="M-4,2 Q-2,3 0,2 Q2,3 4,2">
          <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" begin="1s" repeatCount="indefinite"/>
        </path>
      </g>
      
      <!-- 中央纵裂 -->
      <path d="M0,-7 Q-0.5,-4 0,-1 Q0.5,2 0,5 Q-0.5,7 0,7" stroke="white" stroke-width="0.8" 
            opacity="0.6" fill="none">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/>
      </path>
      
      <!-- 神经活动脉冲点 -->
      <circle cx="-3" cy="-2" r="0.8" fill="white" opacity="0.9">
        <animate attributeName="r" values="0.6;1.2;0.6" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="3" cy="-1" r="0.8" fill="white" opacity="0.9">
        <animate attributeName="r" values="0.6;1.2;0.6" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-1" cy="1" r="0.6" fill="white" opacity="0.9">
        <animate attributeName="r" values="0.4;1;0.4" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="2" cy="2" r="0.6" fill="white" opacity="0.9">
        <animate attributeName="r" values="0.4;1;0.4" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 工具链生态圈 -->
  <!-- 多层推理器 -->
  <g transform="translate(100, 50)">
    <polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#toolGradient)" filter="url(#toolGlow)">
      <animateTransform attributeName="transform" type="scale" values="0.9;1.1;0.9" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </polygon>
    <!-- 思维网络图标 -->
    <g transform="translate(-6, -5)">
      <circle cx="3" cy="2" r="1.5" fill="white"/>
      <circle cx="9" cy="2" r="1.5" fill="white"/>
      <circle cx="6" cy="7" r="1.5" fill="white"/>
      <line x1="4.5" y1="2" x2="7.5" y2="2" stroke="#70D3FF" stroke-width="1"/>
      <line x1="4" y1="3.5" x2="5" y2="5.5" stroke="#70D3FF" stroke-width="1"/>
      <line x1="8" y1="3.5" x2="7" y2="5.5" stroke="#70D3FF" stroke-width="1"/>
    </g>
  </g>

  <!-- 智能策略器 -->
  <g transform="translate(145, 75)">
    <polygon points="0,-15 13,-7.5 13,7.5 0,15 -13,7.5 -13,-7.5" fill="url(#chainGradient)" filter="url(#toolGlow)">
      <animateTransform attributeName="transform" type="scale" values="0.87;1.13;0.87" dur="3.5s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" begin="1s" repeatCount="indefinite"/>
    </polygon>
    <!-- 路径策略图标 -->
    <g transform="translate(-5, -3)">
      <circle cx="1" cy="1" r="1" fill="#1E9CFF"/>
      <circle cx="8" cy="5" r="1" fill="#1E9CFF"/>
      <path d="M2,1 Q4,3 6,3 Q7,4 8,5" stroke="white" stroke-width="1.5" fill="none"/>
      <circle cx="4" cy="3" r="0.5" fill="white"/>
      <circle cx="6" cy="3.5" r="0.5" fill="white"/>
      <polygon points="7,4 8,5 7,6" fill="white"/>
    </g>
  </g>

  <!-- 任务执行器 -->
  <g transform="translate(145, 125)">
    <polygon points="0,-15 13,-7.5 13,7.5 0,15 -13,7.5 -13,-7.5" fill="url(#chainGradient)" filter="url(#toolGlow)">
      <animateTransform attributeName="transform" type="scale" values="0.87;1.13;0.87" dur="3.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" begin="1.5s" repeatCount="indefinite"/>
    </polygon>
    <!-- 执行按钮图标 -->
    <g transform="translate(-5, -3)">
      <circle cx="4" cy="3" r="3" fill="white"/>
      <polygon points="2,1 6,3 2,5" fill="#1E9CFF"/>
      <rect x="7" y="1" width="1" height="4" fill="white"/>
      <polygon points="8,0 9,0 9,1 10,1 10,0 11,0 11,6 10,6 10,5 9,5 9,6 8,6" fill="white"/>
    </g>
  </g>

  <!-- 工具连接器 -->
  <g transform="translate(100, 150)">
    <polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#toolGradient)" filter="url(#toolGlow)">
      <animateTransform attributeName="transform" type="scale" values="0.9;1.1;0.9" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" begin="2s" repeatCount="indefinite"/>
    </polygon>
    <!-- 连接器接口图标 -->
    <g transform="translate(-6, -5)">
      <rect x="0" y="2" width="4" height="4" rx="1" fill="white"/>
      <rect x="8" y="2" width="4" height="4" rx="1" fill="white"/>
      <circle cx="2" cy="4" r="1" fill="#1E9CFF"/>
      <circle cx="10" cy="4" r="1" fill="#1E9CFF"/>
      <line x1="4" y1="4" x2="8" y2="4" stroke="#70D3FF" stroke-width="2"/>
      <circle cx="6" cy="4" r="0.8" fill="#70D3FF"/>
    </g>
  </g>

  <!-- 生态集成器 -->
  <g transform="translate(55, 125)">
    <polygon points="0,-15 13,-7.5 13,7.5 0,15 -13,7.5 -13,-7.5" fill="url(#chainGradient)" filter="url(#toolGlow)">
      <animateTransform attributeName="transform" type="scale" values="0.87;1.13;0.87" dur="3.5s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" begin="2.5s" repeatCount="indefinite"/>
    </polygon>
    <!-- 生态网络图标 -->
    <g transform="translate(-4, -4)">
      <circle cx="2" cy="2" r="1" fill="white"/>
      <circle cx="6" cy="2" r="1" fill="white"/>
      <circle cx="4" cy="6" r="1" fill="white"/>
      <circle cx="8" cy="4" r="0.8" fill="#70D3FF"/>
      <circle cx="0" cy="4" r="0.8" fill="#70D3FF"/>
      <line x1="3" y1="2" x2="5" y2="2" stroke="#70D3FF" stroke-width="0.8"/>
      <line x1="2.5" y1="3" x2="3.5" y2="5" stroke="#70D3FF" stroke-width="0.8"/>
      <line x1="5.5" y1="3" x2="4.5" y2="5" stroke="#70D3FF" stroke-width="0.8"/>
      <line x1="1" y1="3" x2="1" y2="4" stroke="#70D3FF" stroke-width="0.8"/>
      <line x1="7" y1="3" x2="7" y2="4" stroke="#70D3FF" stroke-width="0.8"/>
    </g>
  </g>

  <!-- 学习优化器 -->
  <g transform="translate(55, 75)">
    <polygon points="0,-15 13,-7.5 13,7.5 0,15 -13,7.5 -13,-7.5" fill="url(#chainGradient)" filter="url(#toolGlow)">
      <animateTransform attributeName="transform" type="scale" values="0.87;1.13;0.87" dur="3.5s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" begin="3s" repeatCount="indefinite"/>
    </polygon>
    <!-- 优化曲线图标 -->
    <g transform="translate(-4, -3)">
      <path d="M0,6 Q2,4 4,3 Q6,2 8,1" stroke="white" stroke-width="1.5" fill="none"/>
      <circle cx="0" cy="6" r="0.8" fill="#1E9CFF"/>
      <circle cx="4" cy="3" r="0.8" fill="#70D3FF"/>
      <circle cx="8" cy="1" r="0.8" fill="white"/>
      <polygon points="7,0 8,1 7,2" fill="white"/>
      <rect x="0" y="7" width="8" height="0.5" fill="white" opacity="0.5"/>
    </g>
  </g>

  <!-- 工具链连接网络 -->
  <g opacity="0.6">
    <!-- 从中心到各个工具的连接 -->
    <line x1="100" y1="70" x2="100" y2="68" stroke="url(#toolGradient)" stroke-width="3">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </line>
    
    <line x1="118" y1="82" x2="128" y2="85" stroke="url(#chainGradient)" stroke-width="2.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    
    <line x1="118" y1="118" x2="128" y2="115" stroke="url(#chainGradient)" stroke-width="2.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="1s" repeatCount="indefinite"/>
    </line>
    
    <line x1="100" y1="130" x2="100" y2="132" stroke="url(#toolGradient)" stroke-width="3">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </line>
    
    <line x1="82" y1="118" x2="72" y2="115" stroke="url(#chainGradient)" stroke-width="2.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="2s" repeatCount="indefinite"/>
    </line>
    
    <line x1="82" y1="82" x2="72" y2="85" stroke="url(#chainGradient)" stroke-width="2.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="2.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 六边形协作网络 -->
  <g opacity="0.4">
    <!-- 六边形工具链协作框架 -->
    <polygon points="100,50 145,75 145,125 100,150 55,125 55,75" stroke="url(#coreGradient)" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- 对角协作线 -->
    <line x1="145" y1="75" x2="55" y2="125" stroke="url(#chainGradient)" stroke-width="1" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" begin="1s" repeatCount="indefinite"/>
    </line>
    
    <line x1="145" y1="125" x2="55" y2="75" stroke="url(#chainGradient)" stroke-width="1" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" begin="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 六边形数据流动效果 -->
  <g>
    <!-- 主六边形工具链数据流 -->
    <polygon points="0,-2.5 2.2,-1.25 2.2,1.25 0,2.5 -2.2,1.25 -2.2,-1.25" fill="url(#coreGradient)" opacity="0.8">
      <animateMotion dur="6s" repeatCount="indefinite" path="M100,50 L145,75 L145,125 L100,150 L55,125 L55,75 Z"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- 次要六边形数据流 -->
    <polygon points="0,-2 1.7,-1 1.7,1 0,2 -1.7,1 -1.7,-1" fill="url(#toolGradient)" opacity="0.6">
      <animateMotion dur="5s" begin="1s" repeatCount="indefinite" path="M145,75 L100,50 L55,75 L55,125 L100,150 L145,125 Z"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" dur="5s" begin="1s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- 协同信号流 -->
    <polygon points="0,-1.5 1.3,-0.75 1.3,0.75 0,1.5 -1.3,0.75 -1.3,-0.75" fill="url(#chainGradient)" opacity="0.5">
      <animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M145,75 L55,125 L55,75 L145,125 Z"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- AI智能六边形调度脉冲 -->
  <g transform="translate(100, 100)">
    <!-- 中心向外的六边形脉冲 -->
    <polygon points="0,-35 30,-17.5 30,17.5 0,35 -30,17.5 -30,-17.5" fill="none" stroke="url(#coreGradient)" stroke-width="2" opacity="0.6">
      <animateTransform attributeName="transform" type="scale" values="0.8;2;0.8" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="4s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- 外层六边形激活波纹 -->
    <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="none" stroke="url(#toolGradient)" stroke-width="1" opacity="0.3">
      <animateTransform attributeName="transform" type="scale" values="0.9;1.7;0.9" dur="6s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="6s" begin="1s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg> 